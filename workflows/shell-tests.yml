# Generic shell test harness for project shell scripts (tests/shell/)
#
# Runs the project's tests/shell/run.sh under both dash (/bin/sh) and
# busybox ash - the two shells linbofs-style scripts actually have to work
# under. Copy into any project that ships a tests/shell/ harness (see
# linuxmuster-linbo7 for the reference implementation and
# tests/shell/README.md for harness usage).
#
# Informational only by default: not a required status check in branch
# protection, and not a hard gate for regular pushes/PRs unless the
# project's own release.yml wires it in as one (see release.yml).
#
# thomas@linuxmuster.net
# 20260722

name: Shell tests

on: [push, pull_request, workflow_dispatch, workflow_call]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/linuxmuster/lmndev-runner:latest
      options: --user root
    strategy:
      matrix:
        shell: [sh, busybox_ash]
    steps:
      - uses: actions/checkout@v4
      - name: Run shell tests
        run: |
          if [ "${{ matrix.shell }}" = "busybox_ash" ]; then
            busybox ash tests/shell/run.sh
          else
            sh tests/shell/run.sh
          fi
